<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sarthi Vendor</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#0f0f0f;color:#fff}
.card{background:#1a1a1a;border-radius:20px;padding:20px;margin:16px}
input{width:100%;padding:12px;border-radius:10px;border:none;background:#2a2a2a;color:#fff;margin:6px 0}
.btn{width:100%;padding:12px;background:#ffb26b;border:none;border-radius:10px;font-weight:700;margin-top:10px;cursor:pointer}
.hidden{display:none}.header{padding:16px;background:#1a1a1a;display:flex;justify-content:space-between;position:sticky;top:0}
.nav{position:fixed;bottom:0;left:0;right:0;background:#1a1a1a;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #333}
.nav span{color:#888;font-size:11px;text-align:center;cursor:pointer;padding:5px 15px}.on{color:#ffb26b!important}
.page{padding-bottom:80px}.box{background:#1e1e1e;border-radius:16px;padding:12px;margin:10px 16px;display:flex;gap:12px;align-items:center}
.box img{width:60px;height:60px;border-radius:10px;object-fit:cover}
#preview{width:100%;max-height:200px;border-radius:12px;margin-top:10px;object-fit:cover;display:none}
</style>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
<div class="header"><b>🏪 Vendor Panel</b><button onclick="logout()" style="background:#2a2a2a;color:#fff;border:none;padding:6px 12px;border-radius:8px">Logout</button></div>

<div class="card">
<h3>Add New Product with Photo</h3>
<input id="pname" placeholder="Product Name: Silk Kurta">
<input id="pprice" placeholder="Price: 1499" type="number">
<input id="pstock" placeholder="Stock: 45" type="number">
<input type="file" id="pfile" accept="image/*" onchange="previewImg()">
<img id="preview">
<button class="btn" onclick="addProduct()">Upload to Customer App →</button>
<p id="status" style="text-align:center;margin-top:10px;color:#4ade80"></p>
</div>

<div style="padding:10px 16px"><b>My Uploaded Products</b></div>
<div id="plist"></div>

<div style="height:80px"></div>
<script>
// FIREBASE CONFIG - Apna free wala dal do
const firebaseConfig = {
  apiKey: "AIzaSyDummyKeyForDemo",
  authDomain: "sarthi-shop.firebaseapp.com",
  projectId: "sarthi-shop-demo"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let base64Img = "";
function previewImg(){
  const file = document.getElementById('pfile').files[0];
  const reader = new FileReader();
  reader.onload = e => {
    base64Img = e.target.result;
    document.getElementById('preview').src = base64Img;
    document.getElementById('preview').style.display='block';
  };
  reader.readAsDataURL(file);
}

async function addProduct(){
  const name = pname.value, price = pprice.value, stock = pstock.value;
  if(!name ||!price ||!base64Img) return alert('Name, Price, Photo bharo!');
  status.innerText = "Uploading...";

  // Local save bhi + Firebase me bhi
  let products = JSON.parse(localStorage.getItem('sarthi_products')||'[]');
  let prod = {id:Date.now(), name, price, stock, image: base64Img, vendor: 'Ramesh Traders', time: new Date().toLocaleString()};
  products.unshift(prod);
  localStorage.setItem('sarthi_products', JSON.stringify(products));

  // Firebase try (agar config sahi hai toh)
  try{ await db.collection('products').add(prod); }catch(e){ console.log('Firebase demo mode, local saved'); }

  status.innerText = "✅ Live on Customer App!";
  pname.value='';pprice.value='';pstock.value='';pfile.value='';base64Img='';
  loadProducts();
}

function loadProducts(){
  let products = JSON.parse(localStorage.getItem('sarthi_products')||'[]');
  plist.innerHTML = products.map(p=>`
    <div class="box">
      <img src="${p.image}">
      <div><b>${p.name}</b><br><small>₹${p.price} • Stock ${p.stock}</small><br><small style="color:#4ade80">Live on Customer App</small></div>
    </div>
  `).join('');
}
loadProducts();
function logout(){location.reload()}
</script>
</body>
</html>
